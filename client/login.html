<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b1220" />
  <title>HutFix — Sign In & Register</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/style.css" />
  <script>
    (function() {
      const theme = localStorage.getItem('hutfix_theme') || 'light';
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
</head>
<body style="min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--bg-body); padding:20px;">

  <!-- Theme Toggle -->
  <div style="position:absolute; top:20px; right:20px;">
    <button class="icon-btn theme-toggle-btn" id="themeToggle" aria-label="Toggle theme">
      <i class="bi bi-moon-stars" id="themeIcon"></i>
    </button>
  </div>

  <!-- Auth Container -->
  <div class="panel" style="max-width:440px; width:100%; box-shadow:var(--shadow); border-radius:20px; padding:32px;">
    
    <!-- Header -->
    <div style="text-align:center; margin-bottom:24px;">
      <a href="index.html" style="display:inline-flex; align-items:center; gap:8px; text-decoration:none; color:inherit; margin-bottom:12px;">
        <img src="assets/images/logo.jpg" alt="HutFix" style="width: 36px; height: 36px; border-radius: 8px; object-fit: cover;" />
        <span style="font-family: Manrope, sans-serif; font-weight: 800; font-size: 24px; letter-spacing: -0.5px;">HutFix</span>
      </a>
      <span class="eyebrow" style="display:block;">ACCOUNT PORTAL</span>
      <h2 id="authHeading" style="font-size:22px; margin:4px 0;">Sign in to your account</h2>
    </div>

    <!-- Form -->
    <form id="authForm">
      <div class="form-grid">
        
        <!-- Full Name (Register only) -->
        <div class="form-field full" id="authNameField" style="display:none;">
          <label>Full Name</label>
          <input name="full_name" type="text" placeholder="John Doe" />
        </div>

        <!-- Email -->
        <div class="form-field full">
          <label>Email Address</label>
          <input name="email" type="email" placeholder="you@domain.com" required />
        </div>

        <!-- Phone (Register only) -->
        <div class="form-field full" id="authPhoneField" style="display:none;">
          <label>Phone Number</label>
          <input name="phone" type="tel" placeholder="+880 1711 000000" />
        </div>

        <!-- Password -->
        <div class="form-field full">
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <label>Password</label>
            <a href="#" id="forgotPasswordLink" style="font-size:12px; color:var(--primary); text-decoration:none; font-weight:600;">Forgot Password?</a>
          </div>
          <input name="password" type="password" placeholder="••••••••" required />
        </div>

        <!-- Role (Register only) -->
        <div class="form-field full" id="authRoleField" style="display:none;">
          <label>I want to</label>
          <select name="role">
            <option value="customer">Book Home Services (Client)</option>
            <option value="provider">Offer Specialist Services (Pro)</option>
          </select>
        </div>
      </div>

      <!-- Error Container -->
      <div id="authError" style="color:var(--red); font-size:13px; margin-top:12px; display:none;"></div>

      <!-- Actions -->
      <div style="margin-top:20px; display:flex; flex-direction:column; gap:12px;">
        <button class="primary-btn" id="authSubmitBtn" type="submit" style="width:100%; justify-content:center; padding:12px; font-weight:700;">
          Sign in
        </button>
        <button type="button" class="text-button" id="toggleModeBtn" style="font-size:13px; color:var(--primary); font-weight:600; text-align:center;">
          Don't have an account? Create an account
        </button>
      </div>

      <!-- Demo Logins -->
      <div id="demoRow" style="font-size:13px; color:var(--muted); margin-top:20px; text-align:center; border-top:1px solid var(--border-color); padding-top:14px;">
        <span>Quick Demo Login:</span><br>
        <div style="display:flex; justify-content:center; gap:8px; margin-top:8px;">
          <button type="button" class="secondary-btn" data-demo="customer" style="padding:4px 10px; font-size:12px; min-height:28px;">Customer</button>
          <button type="button" class="secondary-btn" data-demo="provider" style="padding:4px 10px; font-size:12px; min-height:28px;">Provider</button>
          <button type="button" class="secondary-btn" data-demo="admin" style="padding:4px 10px; font-size:12px; min-height:28px;">Admin</button>
        </div>
      </div>
    </form>
  </div>

  <div class="toast" id="toast" role="status"></div>

  <script src="js/global.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
