<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HutFix — Sign In</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      padding: 1.5rem;
      margin: 0;
    }
    .auth-card {
      width: 100%;
      max-width: 440px;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.4);
      padding: 2.5rem;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .brand-logo {
      height: 48px;
      border-radius: 8px;
      margin-bottom: 1rem;
    }
    .form-control:focus, .form-select:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
    }
    .btn-primary {
      background-color: #2563eb;
      border-color: #2563eb;
    }
    .btn-primary:hover {
      background-color: #1d4ed8;
      border-color: #1d4ed8;
    }
  </style>
</head>
<body>
  <div class="auth-card">
    <div class="text-center mb-4">
      <img src="assets/images/logo.jpg" alt="HutFix Logo" class="brand-logo">
      <h1 class="h4 fw-bold text-dark mb-1">HutFix Services</h1>
      <p class="text-muted small">Smart Home Automation & Service Platform</p>
    </div>

    <!-- Tab navigation -->
    <div class="auth-tabs d-flex gap-2 mb-4">
      <button type="button" class="btn btn-primary flex-fill active" data-target="login">Sign In</button>
      <button type="button" class="btn btn-outline-primary flex-fill" data-target="register">Register</button>
    </div>

    <!-- Alert / Error message container -->
    <div id="auth-error" class="alert alert-danger py-2 small d-none" role="alert"></div>

    <!-- Login Form -->
    <form id="login-form">
      <div class="mb-3">
        <label for="login-email" class="form-label small fw-semibold text-secondary">Email Address</label>
        <div class="input-group">
          <span class="input-group-text bg-light text-muted"><i class="bi bi-envelope"></i></span>
          <input type="email" id="login-email" class="form-control" placeholder="user@demo.test" required autocomplete="email">
        </div>
      </div>

      <div class="mb-4">
        <label for="login-password" class="form-label small fw-semibold text-secondary">Password</label>
        <div class="input-group">
          <span class="input-group-text bg-light text-muted"><i class="bi bi-lock"></i></span>
          <input type="password" id="login-password" class="form-control" placeholder="••••••••" required autocomplete="current-password">
        </div>
      </div>

      <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold mb-3">Sign In</button>
    </form>

    <!-- Registration Form -->
    <form id="register-form" class="d-none">
      <div class="mb-3">
        <label for="reg-name" class="form-label small fw-semibold text-secondary">Full Name</label>
        <div class="input-group">
          <span class="input-group-text bg-light text-muted"><i class="bi bi-person"></i></span>
          <input type="text" id="reg-name" class="form-control" placeholder="Full Name" required autocomplete="name">
        </div>
      </div>

      <div class="mb-3">
        <label for="reg-email" class="form-label small fw-semibold text-secondary">Email Address</label>
        <div class="input-group">
          <span class="input-group-text bg-light text-muted"><i class="bi bi-envelope"></i></span>
          <input type="email" id="reg-email" class="form-control" placeholder="user@example.com" required autocomplete="email">
        </div>
      </div>

      <div class="mb-3">
        <label for="reg-password" class="form-label small fw-semibold text-secondary">Password</label>
        <div class="input-group">
          <span class="input-group-text bg-light text-muted"><i class="bi bi-lock"></i></span>
          <input type="password" id="reg-password" class="form-control" placeholder="At least 6 characters" minlength="6" required autocomplete="new-password">
        </div>
      </div>

      <div class="mb-3">
        <label for="reg-phone" class="form-label small fw-semibold text-secondary">Phone Number</label>
        <div class="input-group">
          <span class="input-group-text bg-light text-muted"><i class="bi bi-telephone"></i></span>
          <input type="tel" id="reg-phone" class="form-control" placeholder="+8801700000000" autocomplete="tel">
        </div>
      </div>

      <div class="mb-4">
        <label for="reg-role" class="form-label small fw-semibold text-secondary">Account Type</label>
        <select id="reg-role" class="form-select">
          <option value="customer" selected>Customer (Book services)</option>
          <option value="provider">Service Provider (Offer services)</option>
        </select>
      </div>

      <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold mb-3">Create Account</button>
    </form>

    <!-- Authenticated / Success State -->
    <div id="auth-success" class="text-center py-3 d-none">
      <div class="mb-3">
        <span class="badge bg-success-subtle text-success border border-success-subtle p-2 px-3 rounded-pill">
          <i class="bi bi-check-circle-fill me-1"></i> Authenticated Session Active
        </span>
      </div>
      <h2 class="h5 fw-bold mb-1">Welcome, <span id="who" class="text-primary"></span></h2>
      <p class="text-muted small mb-3">Role: <span id="role" class="fw-semibold text-uppercase badge bg-dark"></span></p>

      <div class="mb-3">
        <a href="#" id="goto-dashboard" class="btn btn-primary w-100 py-2 fw-semibold">Go to my dashboard</a>
      </div>

      <button type="button" id="logout-btn" class="btn btn-outline-danger btn-sm px-4">Sign Out</button>
    </div>

    <!-- Back to home link -->
    <div class="text-center mt-3 pt-3 border-top">
      <a href="/index.html" class="text-decoration-none small text-muted">
        <i class="bi bi-arrow-left me-1"></i> Back to Homepage
      </a>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
