<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HutFix — Smart Home Service Automation (Building)</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #f8fafc;
      font-family: system-ui, -apple-system, sans-serif;
    }
    .hero-card {
      max-width: 540px;
      padding: 2.5rem;
      border-radius: 1rem;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08);
      background: #ffffff;
      border: 1px solid #e2e8f0;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="hero-card mx-auto">
      <img src="assets/images/logo.jpg" alt="HutFix Logo" style="height: 60px; margin-bottom: 1.5rem; border-radius: 8px;">
      <h1 class="h2 fw-bold text-primary mb-2">HutFix</h1>
      <p class="text-muted mb-4">Phase 1 scaffold is live. Full UI arrives in Phase 3+.</p>
      
      <div class="p-3 bg-light rounded-3 mb-3 border">
        <span class="text-secondary me-2">System Status:</span>
        <span id="health-status" class="badge bg-secondary">checking...</span>
      </div>

      <small class="text-muted d-block">Local PostgreSQL + Node/Express Monorepo</small>
    </div>
  </div>

  <script>
    fetch('/api/health')
      .then(res => res.json())
      .then(data => {
        const badge = document.getElementById('health-status');
        if (data.ok && data.db === 'connected') {
          badge.className = 'badge bg-success';
          badge.textContent = 'API + DB connected';
        } else {
          badge.className = 'badge bg-danger';
          badge.textContent = 'API / DB unreachable';
        }
      })
      .catch(() => {
        const badge = document.getElementById('health-status');
        badge.className = 'badge bg-danger';
        badge.textContent = 'API / DB unreachable';
      });
  </script>
</body>
</html>
