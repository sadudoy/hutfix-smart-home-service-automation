<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b1220" />
  <title>HutFix — Reset Password</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/style.css" />
  <script>
    (function() {
      const theme = localStorage.getItem('hutfix_theme') || 'light';
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
</head>
<body style="min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--bg-body); padding:20px;">

  <!-- Theme Toggle -->
  <div style="position:absolute; top:20px; right:20px;">
    <button class="icon-btn theme-toggle-btn" id="themeToggle" aria-label="Toggle theme">
      <i class="bi bi-moon-stars" id="themeIcon"></i>
    </button>
  </div>

  <!-- Reset Password Container -->
  <div class="panel" style="max-width:440px; width:100%; box-shadow:var(--shadow); border-radius:20px; padding:32px;">
    
    <!-- Header -->
    <div style="text-align:center; margin-bottom:24px;">
      <a href="index.html" style="display:inline-flex; align-items:center; gap:8px; text-decoration:none; color:inherit; margin-bottom:12px;">
        <img src="assets/images/logo.jpg" alt="HutFix" style="width: 36px; height: 36px; border-radius: 8px; object-fit: cover;" />
        <span style="font-family: Manrope, sans-serif; font-weight: 800; font-size: 24px; letter-spacing: -0.5px;">HutFix</span>
      </a>
      <span class="eyebrow" style="display:block;">SECURITY</span>
      <h2 style="font-size:22px; margin:4px 0;">Reset your password</h2>
      <p style="font-size:13px; color:var(--text-muted); margin-top:4px;">Enter a new password for your account.</p>
    </div>

    <!-- Form -->
    <form id="resetPasswordForm">
      <div class="form-grid">
        <div class="form-field full">
          <label>New Password</label>
          <input name="password" id="newPasswordInput" type="password" placeholder="At least 6 characters" minlength="6" required />
        </div>

        <div class="form-field full">
          <label>Confirm New Password</label>
          <input name="confirm_password" id="confirmPasswordInput" type="password" placeholder="Repeat your new password" minlength="6" required />
        </div>
      </div>

      <!-- Error Container -->
      <div id="resetError" style="color:var(--red); font-size:13px; margin-top:12px; display:none;"></div>

      <!-- Actions -->
      <div style="margin-top:20px; display:flex; flex-direction:column; gap:12px;">
        <button class="primary-btn" id="resetSubmitBtn" type="submit" style="width:100%; justify-content:center; padding:12px; font-weight:700;">
          Update password
        </button>
        <a href="login.html" class="text-button" style="font-size:13px; color:var(--primary); font-weight:600; text-align:center; text-decoration:none; display:block;">
          <i class="bi bi-arrow-left"></i> Back to Sign In
        </a>
      </div>
    </form>
  </div>

  <div class="toast" id="toast" role="status"></div>

  <script src="js/global.js"></script>
  <script src="js/reset-password.js"></script>
</body>
</html>
