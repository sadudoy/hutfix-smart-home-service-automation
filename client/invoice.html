<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b1220" />
  <title>HutFix — Official Service Invoice</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .invoice-wrap {
      max-width: 820px;
      margin: 40px auto;
      padding: 0 20px;
    }
    .invoice-card {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 44px;
      box-shadow: var(--shadow-md);
      position: relative;
    }
    .invoice-top-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }
    .invoice-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      border-bottom: 2px solid var(--border);
      padding-bottom: 28px;
      margin-bottom: 28px;
    }
    .invoice-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: var(--text-main);
    }
    .invoice-brand-icon {
      width: 42px;
      height: 42px;
      background: linear-gradient(135deg, var(--accent), #0284c7);
      border-radius: 10px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 22px;
    }
    .invoice-meta-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 24px;
      margin-bottom: 32px;
    }
    .meta-box h4 {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-muted);
      margin-bottom: 8px;
    }
    .meta-box p {
      font-size: 14px;
      color: var(--text-main);
      margin: 2px 0;
    }
    .invoice-table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 28px;
    }
    .invoice-table th {
      background: var(--bg-sunken);
      color: var(--text-muted);
      text-transform: uppercase;
      font-size: 11px;
      letter-spacing: 0.08em;
      padding: 12px 16px;
      text-align: left;
      border-bottom: 1px solid var(--border);
    }
    .invoice-table td {
      padding: 16px;
      border-bottom: 1px solid var(--border);
      color: var(--text-main);
      font-size: 14px;
    }
    .invoice-summary {
      width: 300px;
      margin-left: auto;
      border-top: 1px solid var(--border);
      padding-top: 16px;
    }
    .summary-row {
      display: flex;
      justify-content: space-between;
      padding: 6px 0;
      font-size: 14px;
      color: var(--text-muted);
    }
    .summary-row.total-row {
      font-size: 18px;
      font-weight: 800;
      color: var(--text-main);
      border-top: 2px solid var(--border);
      padding-top: 12px;
      margin-top: 8px;
    }
    .invoice-footer-note {
      margin-top: 40px;
      padding-top: 24px;
      border-top: 1px dashed var(--border);
      text-align: center;
      font-size: 12px;
      color: var(--text-muted);
    }

    @media print {
      @page { margin: 0; size: auto; }
      body { background: white !important; color: black !important; }
      body * { visibility: hidden; }
      .invoice-print-area, .invoice-print-area * { visibility: visible; }
      .invoice-print-area {
        position: absolute; left: 0; top: 0; width: 100%;
        padding: 40px; background: white; color: black; display: block !important;
      }
      .sidebar, .topbar, .no-print, button, .invoice-top-actions, .toast { display: none !important; }
      .invoice-card {
        border: none !important;
        box-shadow: none !important;
        padding: 0 !important;
        background: #ffffff !important;
      }
      .invoice-table th {
        background: #f1f5f9 !important;
        color: #334155 !important;
      }
      .summary-row.total-row {
        color: #000000 !important;
      }
    }
  </style>
  <script>
    (function() {
      const theme = localStorage.getItem('hutfix_theme') || 'light';
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
</head>
<body style="min-height: 100vh; background: var(--bg-body);">
  <div class="invoice-wrap">
    <div class="invoice-top-actions no-print">
      <button onclick="window.history.back()" class="btn btn-ghost" style="gap:6px;">
        <i class="bi bi-arrow-left"></i> Back
      </button>
      <div style="display:flex; gap:10px;">
        <button onclick="window.print()" class="btn btn-primary" style="gap:6px;">
          <i class="bi bi-printer"></i> Print / Save PDF
        </button>
      </div>
    </div>

    <div class="invoice-print-area" id="invoice-container">
      <div class="invoice-card" id="invoiceCard">
        <div style="text-align:center; padding:40px; color:var(--text-muted);">
          <i class="bi bi-hourglass-split" style="font-size:32px; display:block; margin-bottom:12px; color:var(--accent);"></i>
          Loading verified invoice details...
        </div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" role="status"></div>

  <script src="js/images.js"></script>
  <script src="js/global.js"></script>
  <script src="js/invoice.js"></script>
</body>
</html>
