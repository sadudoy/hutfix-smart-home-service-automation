<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b1220" />
  <title>HutFix — All Platform Bookings</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/style.css" />
  <script>
    (function() {
      const theme = localStorage.getItem('hutfix_theme') || 'light';
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar"></aside>

    <main class="main-area">
      <header class="topbar" id="topbar"></header>

      <section class="content" id="content">
        <div class="page-head" style="margin-bottom:20px;">
          <span class="eyebrow">BOOKING OPERATIONS</span>
          <h2>All bookings</h2>
          <p>Inspect marketplace activity, assignments, payment methods, and lifecycle progression.</p>
        </div>

        <div class="filter-row">
          <div class="filter-input" style="flex:1;">
            <i class="bi bi-search" style="color:var(--muted); margin-right:8px;"></i>
            <input id="adminBookingSearch" placeholder="Search booking ID, service, customer or specialist..." style="border:none; outline:none; background:transparent; width:100%; color:var(--text-main);" />
          </div>
          <select class="filter-select" id="adminBookingStatusFilter">
            <option value="All">All statuses</option>
            <option value="Pending">Pending</option>
            <option value="In progress">In progress</option>
            <option value="Completed">Completed</option>
            <option value="Cancelled">Cancelled</option>
          </select>
        </div>

        <div class="panel" style="margin-top:20px;">
          <div class="table-wrap">
            <table class="data-table">
              <thead>
                <tr><th>ID</th><th>Date</th><th>Customer</th><th>Provider</th><th>Service</th><th>Payment Method</th><th>Amount</th><th>Status</th></tr>
              </thead>
              <tbody id="allBookingsTableBody">
                <tr><td colspan="8" class="empty-state">Loading bookings ledger...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </section>

      <footer class="footer"><span>© 2026 HutFix Marketplace</span><span>Made for a home that works.</span></footer>
    </main>
  </div>

  <div class="toast" id="toast" role="status"></div>

  <script src="js/images.js"></script>
  <script src="js/global.js"></script>
  <script src="js/admin-bookings.js"></script>
</body>
</html>
