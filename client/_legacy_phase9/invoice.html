<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HutFix - Service Invoice</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="global.css">
    <style>
        body {
            background: var(--bg-color);
            color: var(--text-primary);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            padding: 30px 15px;
        }
        .invoice-card {
            max-width: 680px;
            margin: 0 auto;
            background: var(--surface-color);
            border-radius: 12px;
            padding: 35px;
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border-color);
        }
        .invoice-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 20px;
            margin-bottom: 25px;
        }
        .invoice-meta {
            text-align: right;
        }
        .invoice-table {
            width: 100%;
            border-collapse: collapse;
            margin: 25px 0;
        }
        .invoice-table th {
            text-align: left;
            padding: 12px 0;
            border-bottom: 2px solid var(--border-color);
            color: var(--text-secondary);
            font-size: 0.9rem;
        }
        .invoice-table td {
            padding: 14px 0;
            border-bottom: 1px solid var(--border-color);
        }
        .total-row {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--royal-blue);
        }
        @media print {
            body { background: #fff; padding: 0; }
            .invoice-card { border: none; box-shadow: none; padding: 20px 0; }
            .no-print { display: none; }
        }
    </style>
</head>
<body>
    <div class="invoice-card" id="invoice-card">
        <div class="invoice-header">
            <div>
                <h1 style="color: var(--royal-blue); margin: 0 0 5px 0; font-size: 1.8rem;">
                    <i class="fa-solid fa-house-chimney-medical"></i> HutFix
                </h1>
                <p class="text-muted" style="margin: 0; font-size: 0.9rem;">Smart Home Service Automation</p>
            </div>
            <div class="invoice-meta">
                <h3 style="margin: 0 0 5px 0;" id="invoice-num">INVOICE</h3>
                <span class="text-muted" id="invoice-date" style="font-size: 0.85rem;">Date: --</span>
            </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px;">
            <div>
                <strong style="color: var(--text-secondary); font-size: 0.85rem; text-transform: uppercase;">Billed To:</strong>
                <p id="cust-name" style="margin: 6px 0 2px 0; font-weight: 600;">--</p>
                <p id="cust-phone" class="text-muted" style="margin: 0; font-size: 0.85rem;">--</p>
            </div>
            <div>
                <strong style="color: var(--text-secondary); font-size: 0.85rem; text-transform: uppercase;">Service Provider:</strong>
                <p id="prov-name" style="margin: 6px 0 2px 0; font-weight: 600;">--</p>
                <p id="prov-phone" class="text-muted" style="margin: 0; font-size: 0.85rem;">--</p>
            </div>
        </div>

        <table class="invoice-table">
            <thead>
                <tr>
                    <th>Description</th>
                    <th style="text-align: right;">Amount</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td id="service-desc">Service Delivery</td>
                    <td style="text-align: right;" id="service-subtotal">৳0.00</td>
                </tr>
                <tr>
                    <td>Platform Fee & Tax</td>
                    <td style="text-align: right;" id="service-tax">৳0.00</td>
                </tr>
                <tr class="total-row">
                    <td>Total Due</td>
                    <td style="text-align: right;" id="service-total">৳0.00</td>
                </tr>
            </tbody>
        </table>

        <div class="no-print" style="margin-top: 30px; display: flex; justify-content: space-between; align-items: center;">
            <a href="customer.html" class="btn-outline" style="text-decoration: none; padding: 10px 18px;">
                <i class="fa-solid fa-arrow-left"></i> Back to Dashboard
            </a>
            <button onclick="window.print()" class="btn-primary" style="padding: 10px 22px; cursor: pointer;">
                <i class="fa-solid fa-print"></i> Print Invoice
            </button>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", async function() {
            var urlParams = new URLSearchParams(window.location.search);
            var reqId = urlParams.get('id') || urlParams.get('requestId');
            if (!reqId) {
                alert("No request ID provided.");
                return;
            }

            try {
                var res = await window.API.get('/api/invoices/by-request/' + reqId);
                if (res && res.ok && res.invoice) {
                    var inv = res.invoice;
                    document.getElementById('invoice-num').textContent = 'INVOICE #' + inv.id;
                    document.getElementById('invoice-date').textContent = 'Issued: ' + new Date(inv.issued_at).toLocaleDateString();
                    document.getElementById('cust-name').textContent = inv.customer_name || 'Customer';
                    document.getElementById('cust-phone').textContent = inv.customer_phone || '';
                    document.getElementById('prov-name').textContent = inv.provider_name || 'Provider';
                    document.getElementById('prov-phone').textContent = inv.provider_phone || '';
                    document.getElementById('service-desc').textContent = (inv.category_name || 'Home Service') + ' (Booking #' + reqId + ')';
                    document.getElementById('service-subtotal').textContent = '৳' + Number(inv.subtotal || 0).toFixed(2);
                    document.getElementById('service-tax').textContent = '৳' + Number(inv.tax || 0).toFixed(2);
                    document.getElementById('service-total').textContent = '৳' + Number(inv.total || 0).toFixed(2);
                } else {
                    document.getElementById('service-desc').textContent = "Invoice not found or still pending.";
                }
            } catch (e) {
                console.error("Error loading invoice:", e);
                document.getElementById('service-desc').textContent = "Could not load invoice: " + e.message;
            }
        });
    </script>
</body>
</html>
