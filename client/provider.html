<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HutFix Pro — Provider Portal</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/components.css">
  <style>
    .provider-header-img {
      width: 100%;
      height: 140px;
      object-fit: cover;
      border-radius: var(--radius) var(--radius) 0 0;
    }
    .customer-avatar {
      width: 42px;
      height: 42px;
      object-fit: cover;
      border-radius: 50%;
    }
    .text-truncate-2 {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
  </style>
</head>
<body>

  <!-- Navigation -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top border-bottom shadow-sm">
    <div class="container-fluid px-md-4">
      <a class="navbar-brand d-flex align-items-center gap-2 fw-bold text-white" href="/provider.html">
        <img src="assets/images/logo.jpg" alt="HutFix Logo" style="height: 38px; border-radius: 6px;">
        <span>HutFix <span class="badge bg-primary">PRO</span></span>
      </a>

      <div class="d-flex align-items-center gap-3">
        <a href="/index.html" class="btn btn-outline-light btn-sm px-3 fw-semibold">Platform Home</a>
        <span id="nav-username" class="fw-semibold text-white-50 small">Specialist Portal</span>
        <button type="button" id="logout-btn" class="btn btn-outline-danger btn-sm px-2 py-1">
          <i class="bi bi-box-arrow-right"></i>
        </button>
      </div>
    </div>
  </nav>

  <!-- Main Container -->
  <main class="container py-4 flex-grow-1">
    <div id="role-warning" class="alert alert-warning d-none" role="alert">
      <h5 class="alert-heading fw-bold"><i class="bi bi-exclamation-triangle-fill me-2"></i>Provider Access Only</h5>
      <p class="mb-0">This portal is designed for registered service providers. Please log in with a provider account.</p>
    </div>

    <div id="provider-view">
      <!-- Welcome Header -->
      <div class="d-flex flex-wrap justify-content-between align-items-center mb-4">
        <div>
          <h1 class="h4 fw-bold text-dark mb-1">Provider Service Management</h1>
          <p class="text-muted small mb-0">Accept assignments, coordinate fulfillment, and update task progress.</p>
        </div>
      </div>

      <!-- Tab Navigation -->
      <ul class="nav nav-pills mb-4 gap-2" id="provider-tabs">
        <li class="nav-item">
          <button class="nav-link active fw-semibold" id="tab-incoming" data-bucket="incoming" type="button">
            <i class="bi bi-bell-fill me-1"></i> Incoming Requests
            <span id="incoming-count" class="badge bg-danger ms-1">0</span>
          </button>
        </li>
        <li class="nav-item">
          <button class="nav-link fw-semibold" id="tab-active" data-bucket="active" type="button">
            <i class="bi bi-gear-wide-connected me-1"></i> Active Tasks
          </button>
        </li>
        <li class="nav-item">
          <button class="nav-link fw-semibold" id="tab-history" data-bucket="history" type="button">
            <i class="bi bi-check2-all me-1"></i> Fulfillment History
          </button>
        </li>
      </ul>

      <!-- Requests Grid -->
      <div id="requests-grid" class="row row-cols-1 row-cols-md-2 g-4">
        <!-- Rendered dynamically by client/js/provider.js -->
        <div class="col-12 text-center py-5">
          <div class="spinner-border text-primary" role="status"></div>
          <p class="text-muted small mt-2">Loading assignments...</p>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/images.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/provider.js"></script>
</body>
</html>
