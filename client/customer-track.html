<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b1220" />
  <title>HutFix — Track a Service</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/style.css" />
  <script>
    (function() {
      const theme = localStorage.getItem('hutfix_theme') || 'light';
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar"></aside>

    <main class="main-area">
      <header class="topbar" id="topbar"></header>

      <section class="content" id="content">
        <div class="page-head" style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:20px;">
          <div>
            <span class="eyebrow">LIVE TELEMETRY</span>
            <h2>Track your service</h2>
            <p>Real-time fulfillment tracking and progress updates.</p>
          </div>
          <a href="customer-bookings.html" class="secondary-btn">All bookings</a>
        </div>

        <div id="trackingContainer">
          <div class="empty-state">Connecting to dispatch telemetry...</div>
        </div>
      </section>

      <footer class="footer"><span>© 2026 HutFix Marketplace</span><span>Made for a home that works.</span></footer>
    </main>
  </div>

  <div class="toast" id="toast" role="status"></div>

  <script src="js/images.js"></script>
  <script src="js/global.js"></script>
  <script src="js/customer-track.js"></script>
</body>
</html>
